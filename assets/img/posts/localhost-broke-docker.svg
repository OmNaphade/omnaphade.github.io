<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#38BDF8" opacity="0.16"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1000" cy="120" r="260" fill="url(#glow)" filter="url(#blur)"/>

  <path d="M0 8 H1200 M0 622 H1200" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M8 0 V630 M1192 0 V630" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(72,64)">
    <rect width="140" height="36" rx="18" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="70" y="24" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7DD3FC" text-anchor="middle">DEVOPS</text>
  </g>

  <g transform="translate(100,250)">
    <rect x="0" y="20" width="100" height="80" rx="12" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <rect x="190" y="20" width="100" height="80" rx="12" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <line x1="100" y1="60" x2="190" y2="60" stroke="url(#accent)" stroke-width="4" stroke-dasharray="10 8"/>
    <circle cx="145" cy="60" r="9" fill="#EF4444"/>
    <line x1="139" y1="54" x2="151" y2="66" stroke="#0B0F19" stroke-width="3"/>
    <line x1="151" y1="54" x2="139" y2="66" stroke="#0B0F19" stroke-width="3"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#F8FAFC">
    <text x="72" y="470" font-size="52">When 'localhost' Broke</text>
    <text x="72" y="536" font-size="52">My Entire Docker Setup</text>
  </g>

  <text x="72" y="586" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#94A3B8">TechEtics</text>
</svg>
