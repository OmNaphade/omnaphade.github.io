<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#60A5FA" opacity="0.16"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1000" cy="120" r="260" fill="url(#glow)" filter="url(#blur)"/>

  <path d="M0 8 H1200 M0 622 H1200" stroke="#60A5FA" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M8 0 V630 M1192 0 V630" stroke="#60A5FA" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(72,64)">
    <rect width="140" height="36" rx="18" fill="#60A5FA" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.5"/>
    <text x="70" y="24" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#93C5FD" text-anchor="middle">DEVOPS</text>
  </g>

  <g transform="translate(120,240)">
    <ellipse cx="70" cy="10" rx="70" ry="20" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M0 10 v90 a70 20 0 0 0 140 0 v-90" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M0 55 a70 20 0 0 0 140 0" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6"/>
    <g transform="translate(178,58)">
      <circle r="44" fill="#0B0F19" stroke="url(#accent)" stroke-width="4"/>
      <line x1="0" y1="0" x2="0" y2="-24" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="16" y2="8" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#F8FAFC">
    <text x="72" y="440" font-size="48">FATAL: Invalid TimeZone</text>
    <text x="72" y="500" font-size="48">in PostgreSQL and</text>
    <text x="72" y="560" font-size="48">How I Fixed It</text>
  </g>

  <text x="72" y="596" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#94A3B8">TechEtics</text>
</svg>
