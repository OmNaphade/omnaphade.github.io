<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#8B5CF6" opacity="0.16"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1010" cy="110" r="260" fill="url(#glow)" filter="url(#blur)"/>

  <path d="M0 8 H1200 M0 622 H1200" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M8 0 V630 M1192 0 V630" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(72,64)">
    <rect width="150" height="36" rx="18" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.5"/>
    <text x="75" y="24" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#C4B5FD" text-anchor="middle">FRONTEND</text>
  </g>

  <g transform="translate(110,230)" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.9">
    <line x1="40" y1="150" x2="140" y2="60"/>
    <line x1="40" y1="150" x2="150" y2="180"/>
    <line x1="140" y1="60" x2="230" y2="30"/>
    <line x1="150" y1="180" x2="240" y2="210"/>
    <circle cx="40" cy="150" r="16" fill="#0B0F19" stroke-width="4"/>
    <circle cx="140" cy="60" r="10" fill="#0B0F19"/>
    <circle cx="150" cy="180" r="10" fill="#0B0F19"/>
    <circle cx="230" cy="30" r="8" fill="#0B0F19"/>
    <circle cx="240" cy="210" r="8" fill="#0B0F19"/>
    <circle cx="40" cy="150" r="16" fill="url(#accent)" stroke="none" opacity="0.85"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#F8FAFC">
    <text x="72" y="420" font-size="52">State Management</text>
    <text x="72" y="484" font-size="52">Mistakes I Made in</text>
    <text x="72" y="548" font-size="52">My First Full-Stack App</text>
  </g>

  <text x="72" y="586" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#94A3B8">TechEtics</text>
</svg>
