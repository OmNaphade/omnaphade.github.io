<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#F59E0B" opacity="0.16"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1000" cy="120" r="260" fill="url(#glow)" filter="url(#blur)"/>

  <path d="M0 8 H1200 M0 622 H1200" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M8 0 V630 M1192 0 V630" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(72,64)">
    <rect width="118" height="36" rx="18" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.5"/>
    <text x="59" y="24" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FBBF24" text-anchor="middle">JAVA</text>
  </g>

  <g transform="translate(100,220)" opacity="0.95">
    <text x="0" y="120" font-family="Georgia, serif" font-size="220" font-weight="700" fill="url(#accent)" opacity="0.16">{ }</text>
    <g transform="translate(30,10)">
      <path d="M10 60 h100 v50 a50 50 0 0 1 -50 50 h0 a50 50 0 0 1 -50 -50 z" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M110 72 h18 a20 20 0 0 1 0 40 h-14" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
      <path d="M35 40 q6 -18 -4 -28" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <path d="M60 40 q6 -18 -4 -28" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <path d="M85 40 q6 -18 -4 -28" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#F8FAFC">
    <text x="72" y="470" font-size="58">JAVA: From Basics</text>
    <text x="72" y="536" font-size="58">to Advanced</text>
  </g>

  <text x="72" y="586" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#94A3B8">TechEtics</text>
</svg>
