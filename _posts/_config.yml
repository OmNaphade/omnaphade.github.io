# ------------------ CORE ------------------

theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Kolkata

# ------------------ IDENTITY ------------------

title: "Om's Tech Blog"
tagline: "Backend Engineering • System Design • Cloud"

description: >-
  A technical blog where I share real-world learnings in backend development,
  microservices architecture, cloud (GCP), and debugging production issues.

url: "https://omnaphade.github.io"
baseurl: ""

# ------------------ AUTHOR ------------------

github:
  username: OmNaphade

social:
  name: Om Naphade
  email: omnaphade.dev@gmail.com
  links:
    - https://github.com/OmNaphade
    - https://www.linkedin.com/in/your-linkedin
  rss: true

# ------------------ APPEARANCE ------------------

theme_mode: dark
avatar: https://avatars.githubusercontent.com/u/123349518
toc: true

# ------------------ SEO ------------------

social_preview_image: /assets/img/blog-preview.png

# ------------------ COMMENTS ------------------

comments:
  provider: giscus
  giscus:
    repo: OmNaphade/OmNaphade.github.io
    mapping: pathname
    input_position: bottom
    lang: en

# ------------------ ANALYTICS ------------------

analytics:
  google:
    id:

# ------------------ PAGINATION ------------------

paginate: 10

# ------------------ PWA ------------------

pwa:
  enabled: true
  cache:
    enabled: true

# ------------------ 🔥 IMPORTANT FIX (DO NOT REMOVE) ------------------

plugins:
  - jekyll-paginate
  - jekyll-sitemap

# ------------------ DEFAULTS ------------------

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# ------------------ MARKDOWN ------------------

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true

# ------------------ BUILD ------------------

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all

exclude:
  - "*.gem"
  - "*.gemspec"
  - README.md
  - LICENSE
  